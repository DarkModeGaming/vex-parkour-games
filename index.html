<head>

  <title>Vex Parkour Games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 18px 40px;
      background: #f4f7fb;
      color: #263445;
      font-family: Arial, Helvetica, sans-serif;
    }
    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: clamp(28px, 4vw, 42px);
    }
    .intro {
      margin: 0 0 28px;
      text-align: center;
      color: #5c6878;
    }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
      max-width: 1500px;
      margin: 0 auto;
    }
    .game {
      display: block;
      min-width: 0;
      overflow: hidden;
      aspect-ratio: auto;
      background: #fff;
      border: 1px solid #d4dce6;
      border-radius: 4px;
      box-shadow: 0 5px 14px rgba(26, 42, 66, .08);
      color: #354457;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .game:hover, .game:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 9px 22px rgba(26, 42, 66, .16);
      outline: 2px solid #f4b942;
      outline-offset: 2px;
    }
    .game img {
      display: block;
      width: 100%;
      aspect-ratio: 2.7 / 1;
      object-fit: cover;
      background: #e8eef5;
    }
    .game-name {
      display: block;
      padding: 12px 10px;
      font-size: clamp(16px, 1.5vw, 22px);
      font-weight: 700;
      line-height: 1.2;
    }
    @media (max-width: 480px) {
      .games { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      body { padding: 22px 12px 30px; }
    }
  </style>
</head>
